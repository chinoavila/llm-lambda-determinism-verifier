[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.12"
# mypy es dependencia de ejecución: Baseline 2 lo corre sobre el código del LLM.
dependencies = ["mypy>=1.11,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
