[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["mypy>=1.11,<2", "pytest>=8.3,<9"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
